<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 800" font-family="'Helvetica Neue',Arial,'Malgun Gothic',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/>
    </marker>
    <marker id="arwb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1520" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="46" y="52" font-size="27" font-weight="700" fill="#1c2028">Trajectory predictor — 인코더 교체형 + 멀티모달 헤드</text>
  <text x="46" y="80" font-size="15.5" fill="#6b7280">관측 8스텝을 자기 기준으로 정규화 → 인코더(LSTM 또는 Transformer) → 공유 헤드가 K=3 미래를 가중치·불확실성과 함께 출력</text>

  <!-- ===== Stage 1: Observed ===== -->
  <rect x="46" y="250" width="176" height="196" rx="7" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="134" y="274" font-size="14.5" font-weight="600" fill="#2b2f36" text-anchor="middle">관측 궤적</text>
  <text x="134" y="293" font-size="12" fill="#6b7280" text-anchor="middle">8스텝 · (x,z) · 3.2s</text>
  <!-- mini observed track (hollow dots, blue, 'now' filled) -->
  <polyline points="78,420 92,405 104,386 112,364 118,346 128,338 146,336 168,335" fill="none" stroke="#2f6fdb" stroke-width="2.4"/>
  <g fill="#ffffff" stroke="#2f6fdb" stroke-width="2">
    <circle cx="78" cy="420" r="4"/><circle cx="92" cy="405" r="4"/><circle cx="104" cy="386" r="4"/>
    <circle cx="112" cy="364" r="4"/><circle cx="118" cy="346" r="4"/><circle cx="128" cy="338" r="4"/><circle cx="146" cy="336" r="4"/>
  </g>
  <circle cx="168" cy="335" r="5.2" fill="#2f6fdb"/>
  <text x="184" y="330" font-size="11.5" fill="#2f6fdb" font-weight="600">now</text>

  <line x1="222" y1="348" x2="266" y2="348" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ===== Stage 2: Ego normalize ===== -->
  <rect x="270" y="286" width="168" height="124" rx="7" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="354" y="312" font-size="14.5" font-weight="600" fill="#2b2f36" text-anchor="middle">에이전트 중심 정규화</text>
  <text x="354" y="336" font-size="12" fill="#4b5158" text-anchor="middle">마지막 관측 = 원점</text>
  <text x="354" y="354" font-size="12" fill="#4b5158" text-anchor="middle">진행방향 = +x축</text>
  <!-- small axis icon -->
  <line x1="316" y1="388" x2="360" y2="388" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#arwb)"/>
  <line x1="316" y1="388" x2="316" y2="368" stroke="#9aa4ad" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="366" y="392" font-size="10.5" fill="#2f6fdb">+x</text>

  <line x1="438" y1="348" x2="482" y2="348" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ===== Stage 3: Encoder (interchangeable) ===== -->
  <rect x="486" y="150" width="372" height="396" rx="10" fill="#eef2fb" stroke="#b9c9ee"/>
  <text x="672" y="178" font-size="15.5" font-weight="700" fill="#26406e" text-anchor="middle">인코더 — 교체 가능</text>
  <text x="672" y="197" font-size="11.5" fill="#5b6b8c" text-anchor="middle">같은 64-d 문맥 출력 → 뒷단 공유</text>

  <!-- A. LSTM -->
  <rect x="512" y="214" width="320" height="102" rx="7" fill="#ffffff" stroke="#c8ccd2"/>
  <text x="528" y="238" font-size="13.5" font-weight="700" fill="#2b2f36">A · LSTM 인코더</text>
  <rect x="528" y="252" width="86" height="46" rx="5" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="571" y="279" font-size="12" fill="#4b5158" text-anchor="middle">LSTM</text>
  <line x1="614" y1="275" x2="656" y2="275" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="658" y="252" width="158" height="46" rx="5" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="737" y="272" font-size="11.5" fill="#4b5158" text-anchor="middle">최종 은닉 h_n</text>
  <text x="737" y="288" font-size="10.5" fill="#8a929b" text-anchor="middle">(2 → 64)</text>

  <text x="672" y="336" font-size="13" font-weight="600" fill="#5b6b8c" text-anchor="middle">or</text>

  <!-- B. Transformer -->
  <rect x="512" y="350" width="320" height="176" rx="7" fill="#ffffff" stroke="#c8ccd2"/>
  <text x="528" y="374" font-size="13.5" font-weight="700" fill="#2b2f36">B · Transformer 인코더</text>
  <rect x="528" y="388" width="120" height="46" rx="5" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="588" y="408" font-size="11.5" fill="#4b5158" text-anchor="middle">Linear 2→64</text>
  <text x="588" y="424" font-size="10.5" fill="#8a929b" text-anchor="middle">+ pos enc</text>
  <line x1="648" y1="411" x2="686" y2="411" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="688" y="388" width="128" height="46" rx="5" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="752" y="408" font-size="11.5" fill="#4b5158" text-anchor="middle">self-attention</text>
  <text x="752" y="424" font-size="10.5" fill="#8a929b" text-anchor="middle">2층 · 4헤드</text>
  <rect x="586" y="456" width="172" height="46" rx="5" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="672" y="476" font-size="11.5" fill="#4b5158" text-anchor="middle">마지막 토큰 = "now"</text>
  <text x="672" y="492" font-size="10.5" fill="#8a929b" text-anchor="middle">질의점</text>
  <line x1="672" y1="434" x2="672" y2="454" stroke="#3a3f47" stroke-width="1.6" marker-end="url(#arw)"/>

  <line x1="858" y1="348" x2="902" y2="348" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ===== Stage 4: context ===== -->
  <rect x="906" y="312" width="96" height="72" rx="7" fill="#2b2f36"/>
  <text x="954" y="344" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">문맥</text>
  <text x="954" y="364" font-size="12" fill="#c9d1d9" text-anchor="middle">64-d</text>

  <line x1="1002" y1="348" x2="1046" y2="348" stroke="#3a3f47" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ===== Stage 5: Multimodal head ===== -->
  <rect x="1050" y="270" width="214" height="156" rx="8" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="1157" y="296" font-size="14.5" font-weight="700" fill="#2b2f36" text-anchor="middle">멀티모달 헤드 (MTP)</text>
  <rect x="1070" y="312" width="174" height="34" rx="5" fill="#ffffff" stroke="#c8ccd2"/>
  <text x="1157" y="334" font-size="11.5" fill="#4b5158" text-anchor="middle">Linear 64→64 · ReLU</text>
  <rect x="1070" y="352" width="174" height="56" rx="5" fill="#ffffff" stroke="#c8ccd2"/>
  <text x="1157" y="372" font-size="11.5" fill="#4b5158" text-anchor="middle">Linear → K·12·2</text>
  <text x="1157" y="390" font-size="11.5" fill="#4b5158" text-anchor="middle">+ K (가중치) + K·12 (σ)</text>
  <text x="1157" y="403" font-size="9.5" fill="#8a929b" text-anchor="middle">K=3 모드 · 12스텝</text>

  <line x1="1264" y1="348" x2="1300" y2="348" stroke="#2f6fdb" stroke-width="1.8" marker-end="url(#arwb)"/>

  <!-- ===== Stage 6: K=3 futures ===== -->
  <rect x="1304" y="238" width="180" height="220" rx="7" fill="#f7f8fa" stroke="#c8ccd2"/>
  <text x="1394" y="262" font-size="14.5" font-weight="700" fill="#2b2f36" text-anchor="middle">K=3 미래</text>
  <text x="1394" y="280" font-size="11" fill="#6b7280" text-anchor="middle">각 12스텝 · 4.8s</text>
  <!-- fan of 3 branches from a common now point -->
  <circle cx="1330" cy="400" r="4.5" fill="#2f6fdb"/>
  <path d="M1330,400 C1360,384 1400,368 1462,348" fill="none" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arwb)"/>
  <path d="M1330,400 C1362,392 1404,392 1462,392" fill="none" stroke="#6a9bff" stroke-width="2.3" marker-end="url(#arwb)"/>
  <path d="M1330,400 C1356,412 1392,424 1450,438" fill="none" stroke="#a9c4ff" stroke-width="1.8" marker-end="url(#arwb)"/>
  <text x="1470" y="344" font-size="10" fill="#2f6fdb" text-anchor="end">0.6</text>
  <text x="1470" y="388" font-size="10" fill="#6a9bff" text-anchor="end">0.3</text>
  <text x="1462" y="434" font-size="10" fill="#9bb6ee" text-anchor="end">0.1</text>
  <text x="1394" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle">가중치 softmax · 스텝별 σ</text>

  <!-- ===== Training strip ===== -->
  <rect x="486" y="600" width="998" height="92" rx="8" fill="#fbfbfc" stroke="#e2e5ea"/>
  <text x="510" y="628" font-size="14" font-weight="700" fill="#2b2f36">학습 — best-of-K</text>
  <text x="510" y="652" font-size="12.5" fill="#4b5158">· 가장 가까운(winner) 모드만 Gaussian NLL 로 회귀   · 모드 가중치는 cross-entropy</text>
  <text x="510" y="674" font-size="12.5" fill="#4b5158">→ 하나로 평균 내지 않아 <tspan font-weight="700" fill="#2f6fdb">세 갈래가 뭉개지지 않는다</tspan> (다양·보정된 미래 유지)</text>

  <!-- caption -->
  <text x="46" y="736" font-size="12.5" fill="#8a929b">Figure. 궤적 예측기 구조 — 관측 8스텝(ego 정규화) → 인코더 교체형(LSTM ⇄ Transformer, 동일 64-d) → 멀티모달 헤드 → K=3 미래(경로·가중치·σ).</text>
  <text x="46" y="756" font-size="12.5" fill="#8a929b">근거: trajectory/learned_predictor.py · frame_of()(ego 정규화) · build_net()/build_transformer_net() · mtp_loss()(best-of-K).</text>
</svg>
